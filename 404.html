  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --white:#FFFFFF;--snow:#F8FAFB;--mist:#EEF3F6;--cloud:#DCE5EB;

    html,body{height:100%}
    body{
      font-family:'Outfit',sans-serif;font-weight:400;color:var(--deep);
      background:linear-gradient(180deg,var(--snow) 0%,var(--mist) 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:2rem;text-align:center;-webkit-font-smoothing:antialiased;

    .logo{margin-bottom:3rem;display:flex;align-items:baseline;gap:0.4rem}

    .logo-sub{font-size:0.7rem;font-weight:500;color:var(--slate);text-transform:uppercase;letter-spacing:0.12em}
    .code{font-family:'Cormorant Garamond',serif;font-size:clamp(5rem,15vw,9rem);font-weight:300;font-style:italic;color:var(--sea);line-height:1;letter-spacing:-0.04em;margin-bottom:1rem}

    p{font-size:1rem;color:var(--storm);line-height:1.7;font-weight:300;max-width:480px;margin:0 auto 2.5rem}
    .actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
    .btn{padding:1rem 2.25rem;font-size:0.78rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;border-radius:4px;transition:all 0.3s;display:inline-block}
    .btn-fill{background:var(--sea);color:var(--white)}
    .btn-fill:hover{background:var(--sea-dark);transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,116,144,0.2)}
    .btn-ghost{border:1.5px solid var(--cloud);color:var(--storm)}
    .btn-ghost:hover{border-color:var(--sea);color:var(--sea)}
    .phone{margin-top:3rem;font-size:0.85rem;color:var(--slate);font-weight:300}
    .phone a{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--sea);text-decoration:none;font-weight:500;margin-left:0.5rem}
